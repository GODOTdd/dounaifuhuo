<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffb3cd" />
  <title>观看10s视频复活豆奶 🐱💗</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E" />
  <style>
/* ============================================================
   观看10s视频复活豆奶 🥛💗 —— 可爱粉色弹窗风格
   ============================================================ */

:root {
  --pink-deep: #ff4f81;
  --pink: #ff6f9f;
  --pink-mid: #ff8fb3;
  --pink-soft: #ffb3cd;
  --pink-light: #ffd3e1;
  --pink-pale: #fff3f8;
  --cream: #fffafc;
  --berry: #b0406b;
  --berry-dark: #8a2f52;
  --shadow: rgba(255, 92, 138, 0.3);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  color: var(--berry-dark);
  background:
    radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.55), transparent 34%),
    radial-gradient(circle at 84% 78%, rgba(255, 255, 255, 0.45), transparent 36%),
    linear-gradient(175deg, #ffe6f0 0%, #ffd3e1 52%, #ffc6d7 100%);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

/* ---------- 背景漂浮装饰 ---------- */
.floating-bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.floating-bg span {
  position: absolute;
  bottom: -40px;
  opacity: 0.5;
  animation: driftUp linear infinite;
  user-select: none;
}
@keyframes driftUp {
  0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
  12%  { opacity: 0.55; }
  88%  { opacity: 0.45; }
  100% { transform: translateY(-110vh) rotate(10deg); opacity: 0; }
}

.cloud {
  position: fixed;
  width: 260px;
  height: 70px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 999px;
  filter: blur(2px);
  z-index: 0;
  pointer-events: none;
}
.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud::before { width: 90px; height: 90px; left: 48px; top: -46px; }
.cloud::after  { width: 120px; height: 120px; right: 42px; top: -66px; }
.cloud-1 { top: 12vh; left: -120px; animation: cloudFloat 26s ease-in-out infinite; }
.cloud-2 { top: 62vh; right: -140px; animation: cloudFloat 32s ease-in-out infinite reverse; }
@keyframes cloudFloat {
  0%, 100% { transform: translateX(0); }
  50%      { transform: translateX(90px); }
}

/* ---------- 弹窗主体 ---------- */
.popup {
  position: relative;
  z-index: 10;
  padding: 24px;
  transition: opacity 0.28s ease, transform 0.28s ease;
}
.popup.closing {
  opacity: 0;
  transform: scale(0.82);
}
.popup.gone { display: none !important; }

.popup-card {
  position: relative;
  width: min(460px, 92vw);
  background: var(--cream);
  border: 3px solid #ffe0ec;
  border-radius: 30px;
  padding: 34px 30px 28px;
  text-align: center;
  box-shadow:
    0 18px 44px var(--shadow),
    0 4px 12px rgba(255, 143, 179, 0.25),
    inset 0 0 0 6px rgba(255, 211, 225, 0.35);
  animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn {
  0%   { opacity: 0; transform: scale(0.6) translateY(30px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.close-btn {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: #fff0f6;
  color: var(--berry);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(255, 92, 138, 0.22);
  transition: transform 0.18s ease, background 0.18s ease;
}
.close-btn:hover { transform: rotate(90deg) scale(1.1); background: var(--pink-light); }

/* ---------- 豆奶酱（小猫贴纸） ---------- */
.mascot {
  position: relative;
  width: 220px;
  margin: 0 auto 18px;
}
.mascot.hug { animation: hugBounce 0.9s ease; }
@keyframes hugBounce {
  0%, 100% { transform: scale(1) rotate(0deg); }
  30% { transform: scale(1.18) rotate(-4deg); }
  55% { transform: scale(1.05) rotate(3deg); }
  75% { transform: scale(1.12) rotate(-2deg); }
}

.avatar {
  position: relative;
  width: 196px;
  margin: 0 auto;
  padding: 6px;
  background: #fff;
  border: 3px solid #ffe0ec;
  border-radius: 26px;
  box-shadow: 0 14px 28px rgba(255, 92, 138, 0.28), 0 3px 8px rgba(255, 143, 179, 0.2);
  transform: rotate(-2deg);
  animation: floatySticker 3.2s ease-in-out infinite;
}
@keyframes floatySticker {
  0%, 100% { transform: rotate(-2deg) translateY(0); }
  50%      { transform: rotate(-2deg) translateY(-7px); }
}
.avatar-img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 20px;
}

/* 小名标签 */
.name-tag {
  position: absolute;
  bottom: -11px;
  right: -13px;
  z-index: 4;
  padding: 4px 14px;
  background: linear-gradient(135deg, #ff8fb3, #ff5c8a);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  border-radius: 999px;
  box-shadow: 0 5px 12px rgba(255, 79, 129, 0.4);
  transform: rotate(4deg);
}

/* 眼泪 */
.tear {
  position: absolute;
  font-size: 14px;
  opacity: 0;
  z-index: 3;
  pointer-events: none;
}
.tear-l { left: 56%; top: 72%; }
.tear-r { left: 77%; top: 69%; }
.mood-sad .tear { animation: tearFall 1.8s ease-in infinite; }
.tear-r { animation-delay: 0.9s !important; }
@keyframes tearFall {
  0%   { opacity: 0; transform: translateY(0) scale(0.8); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(34px) scale(1); }
}

/* 心情：大哭（多次点「否」） */
.mood-cry .avatar { animation: wobble 0.5s ease-in-out infinite; }
@keyframes wobble {
  0%, 100% { transform: rotate(-3.6deg); }
  50%      { transform: rotate(-0.4deg); }
}
.mood-cry .tear { opacity: 1; animation: tearFall 1.1s ease-in infinite; }

/* 心情：观看中（小耳机徽章） */
.play-badge {
  display: none;
  position: absolute;
  top: -16px;
  right: -12px;
  z-index: 5;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  background: #fff;
  border: 2px solid var(--pink-light);
  border-radius: 50%;
  box-shadow: 0 6px 14px rgba(255, 92, 138, 0.28);
}
.mood-play .play-badge { display: flex; animation: badgeBounce 1.6s ease-in-out infinite; }
@keyframes badgeBounce {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50%      { transform: translateY(-6px) rotate(6deg); }
}

/* 心情：开心 */
.mood-happy .avatar {
  box-shadow: 0 16px 34px rgba(255, 79, 129, 0.45), 0 0 0 6px rgba(255, 182, 203, 0.55);
}
.mood-happy .halo { display: inline-block; animation: haloSpin 2.4s linear infinite; }
.halo {
  display: none;
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 26px;
}
@keyframes haloSpin {
  0%   { transform: translateX(-50%) rotate(0deg) scale(1); }
  50%  { transform: translateX(-50%) rotate(180deg) scale(1.25); }
  100% { transform: translateX(-50%) rotate(360deg) scale(1); }
}
.mood-happy .sparkle { display: inline-block; }
.sparkle {
  display: none;
  position: absolute;
  color: #ffd166;
  font-size: 16px;
  animation: sparkleBlink 1.6s ease-in-out infinite;
}
.sp-1 { top: 10px; left: 2px; }
.sp-2 { top: 24px; right: -2px; animation-delay: 0.5s; }
.sp-3 { bottom: 10px; left: 8px; animation-delay: 1s; font-size: 12px; }
@keyframes sparkleBlink {
  0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
  50%      { opacity: 1; transform: scale(1.15) rotate(20deg); }
}

/* 气泡台词 */
.bubble-tip {
  position: absolute;
  top: -34px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  max-width: 220px;
  padding: 8px 14px;
  background: #fff;
  border: 2px solid var(--pink-light);
  border-radius: 16px;
  color: var(--berry);
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 5;
  box-shadow: 0 6px 16px rgba(255, 92, 138, 0.18);
  white-space: nowrap;
}
.bubble-tip::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--pink-light);
}
.bubble-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 面板与文字 ---------- */
.panel { animation: fadeUp 0.35s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

h1 {
  margin: 6px 0 10px;
  font-size: 24px;
  color: var(--berry);
  letter-spacing: 1px;
}
.desc {
  margin: 0 auto;
  max-width: 340px;
  font-size: 15px;
  line-height: 1.75;
  color: #b95a80;
}
.desc b { color: var(--pink-deep); }
.mini { font-size: 12px; color: #d98aa8; }

.hint {
  margin: 12px 0 0;
  font-size: 12px;
  color: #d98aa8;
  min-height: 17px;
  transition: color 0.2s ease;
}

/* ---------- 按钮 ---------- */
.btn-row {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 20px;
}
.btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  border-radius: 999px;
  padding: 13px 30px;
  color: var(--berry);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  will-change: transform;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.94); }

.btn-yes {
  background: linear-gradient(135deg, #ff7dab, var(--pink-deep));
  color: #fff;
  box-shadow: 0 8px 18px rgba(255, 79, 129, 0.38);
}
.btn-yes:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 24px rgba(255, 79, 129, 0.46); }

.btn-no {
  background: #fff;
  border: 2px solid var(--pink-mid);
  color: var(--berry);
}
.btn-no:hover { animation: wiggle 0.4s ease; box-shadow: 0 6px 14px rgba(255, 92, 138, 0.25); }
.btn-no.converted { background: linear-gradient(135deg, #ff7dab, var(--pink-deep)); border: none; color: #fff; box-shadow: 0 8px 18px rgba(255, 79, 129, 0.38); }
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-6deg); }
  75% { transform: rotate(6deg); }
}

.btn-soft {
  background: #fff6fa;
  border: 2px dashed var(--pink-mid);
  color: var(--berry);
}
.btn-soft:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(255, 92, 138, 0.24); }

/* ---------- 视频框 ---------- */
.video-box {
  position: relative;
  width: min(330px, 86%);
  aspect-ratio: 16 / 9;
  margin: 14px auto 0;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(135deg, #ffb8d0, #ff8fb3, #ff6f9f);
  background-size: 220% 220%;
  animation: bgShift 3.2s ease infinite;
  box-shadow: 0 10px 22px rgba(255, 79, 129, 0.35);
}
.video-box::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), transparent 42%);
}
@keyframes bgShift {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.video-emoji {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 44px;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
  animation: emojiPulse 1.2s ease-in-out infinite;
  z-index: 2;
}
@keyframes emojiPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.18); }
}

.eq {
  position: absolute;
  left: 14px;
  bottom: 20px;
  display: flex;
  gap: 4px;
  align-items: flex-end;
  height: 26px;
  z-index: 2;
}
.eq i {
  width: 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.95);
  animation: eqBounce 0.9s ease-in-out infinite;
}
.eq i:nth-child(1) { height: 10px; }
.eq i:nth-child(2) { height: 22px; animation-delay: 0.12s; }
.eq i:nth-child(3) { height: 15px; animation-delay: 0.24s; }
.eq i:nth-child(4) { height: 24px; animation-delay: 0.36s; }
.eq i:nth-child(5) { height: 12px; animation-delay: 0.48s; }
@keyframes eqBounce {
  0%, 100% { transform: scaleY(0.4); }
  50%      { transform: scaleY(1); }
}

.progress-track {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 8px;
  height: 8px;
  background: rgba(255, 255, 255, 0.55);
  border-radius: 999px;
  overflow: hidden;
  z-index: 2;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #fff, #ffe9f1);
  border-radius: 999px;
  transition: width 0.3s linear;
}

.vid-heart {
  position: absolute;
  bottom: 24%;
  font-size: 17px;
  opacity: 0;
  z-index: 2;
  animation: heartRise 2.4s linear infinite;
  pointer-events: none;
}
@keyframes heartRise {
  0%   { transform: translateY(0) scale(0.7); opacity: 0; }
  18%  { opacity: 0.95; }
  100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
}

/* ---------- 倒计时环 ---------- */
.countdown {
  position: relative;
  width: 132px;
  height: 132px;
  margin: 16px auto 2px;
}
.countdown svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.ring-bg { fill: none; stroke: var(--pink-light); stroke-width: 11; }
.ring-fg {
  fill: none;
  stroke: url(#ringGrad);
  stroke: var(--pink-deep);
  stroke-width: 11;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.3s linear;
  filter: drop-shadow(0 0 6px rgba(255, 79, 129, 0.55));
}
.count-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  font-weight: 900;
  color: var(--pink-deep);
  text-shadow: 0 3px 0 #fff;
}

/* ---------- 右下角悬浮豆奶 ---------- */
.corner-fab {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 60;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, #ff8fb3, var(--pink-deep));
  padding: 12px 20px;
  border-radius: 999px;
  box-shadow: 0 10px 22px rgba(255, 79, 129, 0.4);
  animation: fabBounce 2.2s ease-in-out infinite;
  transition: transform 0.18s ease;
}
.corner-fab:hover { transform: scale(1.08); }
@keyframes fabBounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

/* ---------- 彩带与心形爆花 ---------- */
#confetti {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 100;
}

.burst-heart {
  position: fixed;
  pointer-events: none;
  z-index: 95;
  animation: burstUp 1s ease-out forwards;
}
@keyframes burstUp {
  0%   { opacity: 1; transform: translate(0, 0) scale(0.5); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.35) rotate(18deg); }
}

/* ---------- 顶部吐司提示 ---------- */
.toast {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translate(-50%, -16px);
  z-index: 90;
  background: linear-gradient(135deg, #ff8fb3, var(--pink-deep));
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  padding: 10px 22px;
  border-radius: 999px;
  box-shadow: 0 8px 20px rgba(255, 79, 129, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 小屏适配 ---------- */
@media (max-width: 420px) {
  .popup-card { padding: 26px 18px 22px; }
  h1 { font-size: 21px; }
  .btn { padding: 12px 22px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

  <!-- 背景漂浮装饰 -->
  <div class="floating-bg" id="floatingBg" aria-hidden="true"></div>
  <div class="cloud cloud-1" aria-hidden="true"></div>
  <div class="cloud cloud-2" aria-hidden="true"></div>

  <!-- 主弹窗 -->
  <main class="popup" id="popup">
    <div class="popup-card" id="popupCard" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <button class="close-btn" id="closeBtn" type="button" title="暂时关掉弹窗" aria-label="暂时关掉弹窗">✕</button>

      <!-- 豆奶酱（小猫贴纸） -->

          <span class="name-tag" aria-hidden="true">豆奶</span>
        </div>
        <div class="bubble-tip" id="bubbleTip">…</div>
      </div>

      <!-- 状态一：询问 -->
      <section class="panel" id="panelAsk" data-state="ask">
        <h1 id="popupTitle">豆奶酱要坚持不住啦！</h1>
        <p class="desc">只要观看 <b>10 秒</b>视频，就能复活可爱的<b>豆奶酱</b> 🐱<br />你愿意救救它吗？</p>
        <div class="btn-row">
          <button class="btn btn-yes" id="btnYes" type="button">是！我救！</button>
          <button class="btn btn-no" id="btnNo" type="button">否</button>
        </div>
        <p class="hint" id="noHint">（「否」按钮好像会逃跑哦…）</p>
      </section>

      <!-- 状态二：观看10s视频 -->
      <section class="panel" id="panelPlaying" hidden>
        <h1>正在观看视频… 🎬</h1>
        <div class="video-box" id="videoBox">
          <span class="video-emoji" aria-hidden="true">🐱💗</span>
          <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="countdown" aria-live="polite">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
          </svg>
          <span class="count-num" id="countNum">10</span>
        </div>
        <p class="desc">复活能量积累中：<b id="energy">0</b>%　<span class="mini">别走开哦～</span></p>
      </section>

      <!-- 状态三：复活成功 -->
      <section class="panel" id="panelSuccess" hidden>
        <h1>复活成功！！ 🎉✨</h1>
        <p class="desc">感谢你耐心看完 10 秒视频，<b>豆奶酱</b>满血复活啦！<br />今天也要一起元气满满哦～ 💪</p>
        <div class="btn-row">
          <button class="btn btn-yes" id="btnAgain" type="button">再救一次</button>
          <button class="btn btn-soft" id="btnHug" type="button">抱抱豆奶酱</button>
        </div>
      </section>
    </div>
  </main>

  <!-- 关掉弹窗后的悬浮小豆奶 -->
  <button class="corner-fab" id="fab" type="button" hidden>🐱 豆奶酱在想你…</button>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script>
/* ============================================================
   观看10s视频复活豆奶 🥛💗 —— 交互逻辑
   状态机：ask（询问）→ playing（观看10s）→ success（复活成功）
   ============================================================ */
(() => {
  'use strict';

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const DURATION = 10;                 // 需要观看的秒数
  const RING_C = 2 * Math.PI * 52;     // 倒计时环周长
  const SAD_LINES = [
    '呜…你忍心吗 (｡•́︿•̀｡)',
    '豆奶酱真的会消失的…',
    '救命！我要被喝掉啦！',
  ];

  const els = {
    popup: $('#popup'),
    card: $('#popupCard'),
    closeBtn: $('#closeBtn'),
    fab: $('#fab'),
    mascot: $('#mascot'),
    bubble: $('#bubbleTip'),
    panelAsk: $('#panelAsk'),
    panelPlaying: $('#panelPlaying'),
    panelSuccess: $('#panelSuccess'),
    btnYes: $('#btnYes'),
    btnNo: $('#btnNo'),
    btnAgain: $('#btnAgain'),
    btnHug: $('#btnHug'),
    noHint: $('#noHint'),
    countNum: $('#countNum'),
    ringFg: $('#ringFg'),
    progressFill: $('#progressFill'),
    energy: $('#energy'),
    videoBox: $('#videoBox'),
    confetti: $('#confetti'),
    floatingBg: $('#floatingBg'),
  };

  let state = 'ask';        // ask | playing | success | closed
  let noCount = 0;          // 点了多少次「否」
  let timerId = null;
  let startTs = 0;
  let bubbleTimer = null;
  let toastTimer = null;

  /* ---------------- 工具函数 ---------------- */

  /** 切换豆奶酱心情（弹窗根元素上的 mood-* 类） */
  function setMood(mood) {
    els.popup.classList.forEach((c) => { if (/^mood-/.test(c)) els.popup.classList.remove(c); });
    els.popup.classList.add(mood);
  }

  /** 显示指定状态面板（ask / playing / success） */
  function setPanel(name) {
    els.panelAsk.hidden = name !== 'ask';
    els.panelPlaying.hidden = name !== 'playing';
    els.panelSuccess.hidden = name !== 'success';
  }

  function setState(next) {
    state = next;
    setPanel(next);
    const moodMap = { ask: 'mood-sad', playing: 'mood-play', success: 'mood-happy' };
    setMood(moodMap[next]);
  }

  /** 豆奶酱说一句话（气泡） */
  function say(text) {
    els.bubble.textContent = text;
    els.bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => els.bubble.classList.remove('show'), 2400);
  }

  /** 顶部吐司提示 */
  function toast(text) {
    let t = $('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      t.setAttribute('aria-live', 'polite');
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /** 重置倒计时相关 UI */
  function resetTimerUI() {
    els.countNum.textContent = String(DURATION);
    els.ringFg.style.strokeDashoffset = RING_C.toFixed(2);
    els.progressFill.style.width = '0%';
    els.energy.textContent = '0';
    $$('.vid-heart', els.videoBox).forEach((h) => h.remove());
  }

  /** 重置到初始询问状态 */
  function resetAll() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    noCount = 0;
    resetTimerUI();
    els.btnNo.classList.remove('converted');
    els.btnNo.textContent = '否';
    els.btnNo.style.transform = '';
    els.noHint.textContent = '（「否」按钮好像会逃跑哦…）';
    setState('ask');
    say('救救我吧，你是我最后的希望啦！ (´•̥ ω •̥`)');
  }

  /* ---------------- 一、询问：是 / 否 ---------------- */

  els.btnYes.addEventListener('click', startVideo);

  /** 「否」按钮：会害羞地逃跑 */
  els.btnNo.addEventListener('pointerenter', () => {
    if (state !== 'ask' || els.btnNo.classList.contains('converted')) return;
    const dx = (Math.random() > 0.5 ? 1 : -1) * (95 + Math.random() * 75);
    const dy = (Math.random() - 0.5) * 80;
    els.btnNo.style.transform = `translate(${dx.toFixed(0)}px, ${dy.toFixed(0)}px) rotate(${((Math.random() - 0.5) * 24).toFixed(0)}deg)`;
    els.noHint.textContent = '（「否」按钮害羞地逃跑了！）';
  });

  els.btnNo.addEventListener('click', () => {
    if (state !== 'ask') return;
    if (els.btnNo.classList.contains('converted')) { startVideo(); return; }

    noCount += 1;
    if (noCount >= 3) {
      // 第3次拒绝：按钮心软，变成「好啦好啦，我救！」
      els.btnNo.classList.add('converted');
      els.btnNo.textContent = '好啦好啦，我救！';
      els.btnNo.style.transform = '';
      els.noHint.textContent = '（豆奶酱哭得太惨了，「否」按钮都心软了…）';
      say('呜呜呜呜…（哭得更大声了）');
      setMood('mood-cry');
      toast('💦 豆奶酱的哭声震动了整个屏幕！');
    } else {
      say(SAD_LINES[Math.min(noCount - 1, SAD_LINES.length - 1)]);
      setMood(noCount >= 2 ? 'mood-cry' : 'mood-sad');
      els.noHint.textContent = '（再拒绝的话，按钮就要叛变了…）';
    }
  });

  /* ---------------- 二、观看 10s 视频 ---------------- */

  function startVideo() {
    if (state === 'playing') return;
    if (timerId) { clearInterval(timerId); timerId = null; }
    resetTimerUI();
    spawnVideoHearts();
    setState('playing');
    startTs = performance.now();
    timerId = setInterval(tick, 100);
    say('认真看视频哦，不要偷看豆奶酱！ 🎧');
  }

  function tick() {
    const elapsed = (performance.now() - startTs) / 1000;
    const progress = Math.min(1, elapsed / DURATION);
    const remaining = Math.max(0, Math.ceil(DURATION - elapsed));

    els.countNum.textContent = String(remaining);
    els.ringFg.style.strokeDashoffset = (RING_C * (1 - progress)).toFixed(2);
    els.progressFill.style.width = `${(progress * 100).toFixed(1)}%`;
    els.energy.textContent = String(Math.round(progress * 100));

    if (progress >= 1) finish();
  }

  function finish() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    setState('success');
    confettiBurst();
    toast('🎉 复活能量 100%！豆奶酱复活啦！');
    say('谢谢泥！豆奶酱满血复活啦 (≧▽≦)');
  }

  /** 视频框里飘几颗小爱心 */
  function spawnVideoHearts() {
    const list = ['💗', '💕', '🩷', '💖', '🥛'];
    for (let i = 0; i < 4; i++) {
      const h = document.createElement('span');
      h.className = 'vid-heart';
      h.textContent = list[i % list.length];
      h.style.left = `${10 + Math.random() * 80}%`;
      h.style.animationDelay = `${(Math.random() * 2).toFixed(2)}s`;
      h.style.fontSize = `${13 + Math.random() * 9}px`;
      els.videoBox.appendChild(h);
    }
  }

  /* ---------------- 三、复活成功 ---------------- */

  els.btnAgain.addEventListener('click', resetAll);

  els.btnHug.addEventListener('click', () => {
    els.mascot.classList.remove('hug');
    void els.mascot.offsetWidth; // 重新触发动画
    els.mascot.classList.add('hug');
    burstHearts();
    say('被治愈啦～ (´▽`ʃ♡ƪ)');
    toast('💝 豆奶酱获得了温暖的抱抱！');
  });

  /** 豆奶酱周围爆出爱心 */
  function burstHearts() {
    const emojis = ['💗', '💕', '💖', '🩷', '💘', '💝'];
    const rect = els.mascot.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'burst-heart';
      s.textContent = emojis[(Math.random() * emojis.length) | 0];
      s.style.left = `${cx}px`;
      s.style.top = `${cy}px`;
      s.style.fontSize = `${(14 + Math.random() * 14).toFixed(0)}px`;
      s.style.setProperty('--dx', `${((Math.random() - 0.5) * 190).toFixed(0)}px`);
      s.style.setProperty('--dy', `${(-(60 + Math.random() * 130)).toFixed(0)}px`);
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  }

  /* ---------------- 关窗 / 重开 ---------------- */

  els.closeBtn.addEventListener('click', closePopup);

  function closePopup() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    const panels = els.popup.classList;
    els.popup.classList.add('closing');
    setTimeout(() => {
      els.popup.classList.add('gone');
      els.popup.classList.remove('closing');
      state = 'closed';
    }, 280);
    els.fab.hidden = false;
  }

  els.fab.addEventListener('click', () => {
    els.popup.classList.remove('gone', 'closing');
    resetAll();
  });

  /* ---------------- 彩带（复活成功庆祝） ---------------- */

  function confettiBurst() {
    const canvas = els.confetti;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);

    const colors = ['#ff4f81', '#ff8fb3', '#ffc2d1', '#ffffff', '#ffb3c8', '#ffb740'];
    const pieces = Array.from({ length: 140 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.35 + (Math.random() - 0.5) * 50,
      vx: (Math.random() - 0.5) * 10,
      vy: -(3 + Math.random() * 5),
      w: 6 + Math.random() * 7,
      h: 9 + Math.random() * 9,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.32,
      color: colors[(Math.random() * colors.length) | 0],
      circle: Math.random() < 0.35,
    }));

    const start = performance.now();
    (function frame(now) {
      const t = now - start;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx;
        p.vy += 0.13;
        p.y += p.vy;
        p.rot += p.vr;
        if (p.y < innerHeight + 40 && t < 4200) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = t > 3200 ? Math.max(0, 1 - (t - 3200) / 1000) : 1;
          ctx.fillStyle = p.color;
          if (p.circle) {
            ctx.beginPath();
            ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          ctx.restore();
        }
      }
      if (alive) requestAnimationFrame(frame);
    })(start);
  }

  /* ---------------- 背景漂浮小装饰 ---------------- */

  function buildFloaters() {
    const items = ['💗', '💕', '🥛', '✨', '🌸', '🫧', '💖', '🩷'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      s.textContent = items[(Math.random() * items.length) | 0];
      s.style.left = `${(Math.random() * 100).toFixed(1)}%`;
      s.style.fontSize = `${(14 + Math.random() * 20).toFixed(0)}px`;
      s.style.animationDuration = `${(12 + Math.random() * 14).toFixed(1)}s`;
      s.style.animationDelay = `${(-(Math.random() * 22)).toFixed(1)}s`;
      els.floatingBg.appendChild(s);
    }
  }

  /* ---------------- 初始化 ---------------- */

  // 倒计时环：初始为满圈
  els.ringFg.style.strokeDasharray = RING_C.toFixed(2);
  els.ringFg.style.strokeDashoffset = RING_C.toFixed(2);

  buildFloaters();
  setState('ask');
  say('救救我吧，你是我最后的希望啦！ (´•̥ ω •̥`)');
})();
</script>
</body>
</html>
